# /src/test/resources/application.yml
# 这是专门用于测试环境的配置文件

# --- H2 Database Configuration for Testing ---
spring:
  datasource:
    # 使用H2内存数据库，模式为MySQL兼容模式
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # --- JPA/Hibernate Configuration ---
  jpa:
    hibernate:
      # 让Hibernate根据你的实体类自动创建/删除表结构
      ddl-auto: create-drop
    # 显示SQL语句，便于调试
    show-sql: true

  # --- Spring Batch Configuration ---
  batch:
    job:
      # 在测试环境中，通常不需要在应用启动时自动运行批处理作业
      enabled: false
    jdbc:
      # 每次运行时都初始化Spring Batch所需的元数据表
      initialize-schema: always

# 覆盖可能存在的主配置中的MyBatis Plus配置，简化测试环境
mybatis-plus:
  global-config:
    db-config:
      id-type: auto